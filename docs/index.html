  <a class="demo-entry" href="./ai-workflow.html" data-page-node-id="3aGOLJJOoSsEBc7wuGhgcm">AI Assistant demo →</a>

    <!-- The nav renders as React <button>s, so a plain <a> cannot reach it.
         Listen in the capture phase on `document`: this fires before React's
         root-container listener, and stopPropagation keeps React's onClick from
         ever seeing the click — so `page` never flips to 'ai' and the
         backend-dependent ChatPage is never mounted. -->
    <script>
      (function () {
        // Both languages: the nav label is re-rendered as zh/en by the toggle.
        var LABELS = ['AI 助手', 'AI Assistant'];
        document.addEventListener(
          'click',
          function (e) {
            var t = e.target;
            var item = t && t.closest && t.closest('.nav__list .nav__item');
            if (!item) return;
            var text = item.textContent || '';
            for (var i = 0; i < LABELS.length; i++) {
              if (text.indexOf(LABELS[i]) !== -1) {
                e.preventDefault();
                e.stopPropagation();
                window.location.href = './ai-workflow.html';
                return;
              }
            }
          },
          true
        );
      })();
    </script>
  </body>
